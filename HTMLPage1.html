<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Victorian Spirit Camera</title>

    <link rel="stylesheet" href="StyleSheet1.css">
</head>

<body>

    <div id="camera-container">

        <!-- Live Camera Feed -->
        <video id="camera-view"
               autoplay
               playsinline
               muted></video>

        <!-- Controls Panel -->
        <div id="controls-panel">

            <details>
                <summary>Controls</summary>

                <div id="controls-content">

                    <label>
                        Motion Memory
                        <input type="range"
                               min="1"
                               max="100"
                               value="50"
                               id="memory-slider">
                    </label>

                    <label>
                        Ghost Visibility
                        <input type="range"
                               min="1"
                               max="100"
                               value="50"
                               id="visibility-slider">
                    </label>

                    <label>
                        Ghost Blur
                        <input type="range"
                               min="0"
                               max="50"
                               value="10"
                               id="blur-slider">
                    </label>

                    <label>
                        Contrast
                        <input type="range"
                               min="0"
                               max="200"
                               value="100"
                               id="contrast-slider">
                    </label>

                    <label>
                        Brightness
                        <input type="range"
                               min="0"
                               max="200"
                               value="100"
                               id="brightness-slider">
                    </label>

                    <label>
                        Film Grain
                        <input type="range"
                               min="0"
                               max="100"
                               value="20"
                               id="grain-slider">
                    </label>

                </div>

            </details>

        </div>

        <!-- Zoom Controls -->
        <div id="zoom-controls">

            <button id="zoom-in">+</button>

            <button id="zoom-out">−</button>

        </div>

        <!-- Countdown -->
        <div id="countdown">
            10
        </div>

        <!-- Bottom Buttons -->
        <div id="button-bar">

            <button id="capture-btn">
                CAPTURE
            </button>

            <button id="reset-btn">
                RESET
            </button>

        </div>

    </div>

    <script src="Script1.js"></script>

</body>
</html>
